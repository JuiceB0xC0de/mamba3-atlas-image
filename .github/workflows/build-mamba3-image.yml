name: build mamba3 atlas image

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile'
      - '.github/workflows/build-mamba3-image.yml'
      # The Dockerfile COPYs analysis/ and prompts/ into the image, so a change
      # to either changes the image. Without these entries a pipeline edit
      # pushes green and the published image silently stays stale.
      - 'analysis/**'
      - 'prompts/**'
  workflow_dispatch:
    inputs:
      mamba_ref:
        description: 'mamba git ref to build against'
        default: 'main'
      tag:
        description: 'extra tag to publish'
        default: ''

env:
  IMAGE: juiceboxdocks/mamba3-atlas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the CUDA devel base plus torch/tilelang/cutlass is large; reclaim runner disk
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            MAMBA_REF=${{ inputs.mamba_ref || 'main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ inputs.tag && format('{0}:{1}', env.IMAGE, inputs.tag) || '' }}
          # NOT type=gha: GitHub's Actions Cache is capped at 10 GB per repo and
          # this image is ~8 GB, so mode=max thrashes, evicts, and adds ~10 min of
          # layer export for no reuse. Docker Hub has no such cap.
          cache-from: type=registry,ref=juiceboxdocks/mamba3-atlas:buildcache
          cache-to: type=registry,ref=juiceboxdocks/mamba3-atlas:buildcache,mode=max
