name: build mamba3 atlas image

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile'
      - '.github/workflows/build-mamba3-image.yml'
  workflow_dispatch:
    inputs:
      mamba_ref:
        description: 'mamba git ref to build against'
        default: 'main'
      tag:
        description: 'extra tag to publish'
        default: ''

env:
  IMAGE: juiceboxdocks/mamba3-atlas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the CUDA devel base plus torch/tilelang/cutlass is large; reclaim runner disk
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            MAMBA_REF=${{ inputs.mamba_ref || 'main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ inputs.tag && format('{0}:{1}', env.IMAGE, inputs.tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
